# Nome dell'applicazione
spring.application.name=backend_immobiliare

# --- AVVIO RAPIDO ---
spring.main.lazy-initialization=true

# --- DATABASE ---
# Le credenziali si leggono da variabili d'ambiente: non scrivere mai valori reali in questo file.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HIKARI CP ---
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5

# --- JPA / HIBERNATE ---
# In locale si puo' impostare DDL_AUTO=update per creare le tabelle al primo avvio
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# --- UPLOAD ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- REDIS ---
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- LOGGING ---
logging.level.root=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.hibernate=WARN

# --- SEGRETI (da variabili d'ambiente) ---
geoapify.api-key=${GEOAPIFY_API_KEY}
app.admin.default-email=${ADMIN_DEFAULT_EMAIL:admin}
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD}
